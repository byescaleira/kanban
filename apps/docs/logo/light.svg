<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <!-- The mark: a filled plate with two fields. Near-black ink over the
       accent, because white on #ff6b00 is 2.86:1 and fails AA. -->
  <g transform="translate(0 22) scale(9.0)">
    <rect x="1" y="1" width="22" height="22" rx="7" fill="#ff6b00"/>
    <rect x="6" y="6" width="5" height="12" rx="2" fill="#26241f"/>
    <rect x="13" y="6" width="5" height="7" rx="2" fill="#26241f"/>
  </g>
  <!-- The name is set in ink, never in orange: no orange bright enough
       to feel vibrant clears 4.5:1 as type. System stack, weight 600. -->
  <text x="248" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="168" font-weight="600" letter-spacing="-4" fill="#26241f">Kanban</text>
</svg>
